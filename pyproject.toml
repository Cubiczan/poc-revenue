[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poc-revenue"
version = "0.1.0"
description = "Deterministic ASC 606 / percentage-of-completion revenue engine with variable-consideration constraint, onerous-contract loss, and evidence pack."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Cubiczan", email = "sam@cubiczan.com" }]
license = { text = "MIT" }
keywords = ["asc-606", "percentage-of-completion", "revenue", "icfr"]
# Deliberate hard dependency (overriding the pre-row-16 zero-dependency
# design): an optional [mcp] extra would ship a server that cannot start
# from a default install, breaking the six-engine publishing convention.
# Documented in README "MCP server".
dependencies = ["mcp>=1.2,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
poc-revenue = "poc_revenue.cli:main"
poc-revenue-mcp = "poc_revenue.mcp_server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
